<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="keywords" content="" />
    <meta name="author" content="Xavier Alvarez" />
    <meta property="og:title" content="2D Noise Generator Showcase" />
    <meta property="og:description" content="" />
    <meta property="og:image" content="" />
    <meta property="og:url" content="" />
    <meta property="og:type" content="website" />
    <title>2D Noise Generator Showcase</title>

    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <nav>
      <ul class="nav-ul">
        <li class="active">
          <a aria-current="page">
            <span>Home</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span>White Noise</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span>Gaussian Noise</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span>Random Walk Noise</span>
          </a>
        </li>
      </ul>
    </nav>
    <div id="main-content">
      <header></header>
      <div id="content">
        <random-walk-noise
          class="noise-holder"
          inputsRoot="#noise-inputs"
          useProgress="true"
        ></random-walk-noise>
        <div id="noise-inputs">
          <input
            type="range"
            name="progress"
            min="0"
            max="1"
            value="1.0"
            step="0.001"
          />
          <input
            type="range"
            name="resolution"
            min="50"
            max="600"
            value="300"
            step="1"
          />
          <input
            type="range"
            name="intensity"
            min="0"
            max="255"
            value="50"
            step="0.1"
          />
        </div>
      </div>
      <footer></footer>
    </div>
    <!-- Scripts -->
    <script src="../dist/scripts.js"></script>
  </body>
</html>
