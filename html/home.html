<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="keywords" content="" />
    <meta name="author" content="Xavier Alvarez" />
    <meta property="og:title" content="2D Noise Generator Showcase" />
    <meta property="og:description" content="" />
    <meta property="og:image" content="" />
    <meta property="og:url" content="" />
    <meta property="og:type" content="website" />
    <title>2D Noise Generator Showcase</title>

    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body class="flex-row">
    <nav id="nav-bar">
      <ul class="nav-ul">
        <li class="active">
          <a aria-current="page">
            <span>Home</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span>White Noise</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span>Gaussian Noise</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span>Random Walk Noise</span>
          </a>
        </li>
      </ul>
    </nav>
    <div id="content-wrapper">
      <div class="content-body">
        <header class="flex-col max-expand">
          <h1 id="home-h1">
            <p>Hello to all fellow</p>
            <p>enthusiasts.</p>
          </h1>
          <div id="home-text">
            <p>
              I was inspired after watching a <a>Youtube video</a> related to
              created 2D Noise Textures, believing I could compile and expanded
              collection.
            </p>
            <p>
              Check the <a>glossary</a> for any basic terms you may not know.
            </p>
          </div>

          <white-noise
            class="noise-holder"
            inputsRoot="#noise-inputs"
            useProgress="true"
          ></white-noise>
          <div id="noise-inputs">
            <input
              type="range"
              name="progressRatio"
              min="0"
              max="1"
              value="1.0"
              step="0.001"
            />
            <input
              type="range"
              name="resolution"
              min="50"
              max="600"
              value="50"
              step="1"
            />
          </div>
        </header>
      </div>
      <footer></footer>
      <div class="links-bar"></div>
    </div>
    <!-- Scripts -->
    <script type="module" src="../dist/helperMethods.js"></script>
    <script type="module" src="../dist/scripts.js"></script>
  </body>
</html>
